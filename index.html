    #toast.show { visibility: visible; opacity: 1; }
    .empty { text-align: center; padding: 20px; color: #94a3b8; font-size: 13px; }
  </style>
</head>

<body>

  <div class="header">
    <h1>📱 Master Prompt Manager</h1>
    <p>Simpan & Salin Prompt AI (Cloud Sync ☁️)</p>
  </div>

  <div id="syncStatus" class="sync-status">🔄 Menghubungkan ke Cloud...</div>

  <div class="form-box">
    <label for="title">Judul Prompt</label>
    <input type="text" id="title" placeholder="Misal: Video Cinematic Luma AI">

    <label for="category">Kategori / Tag</label>
    <input type="text" id="category" placeholder="Misal: Video, Gambar, Midjourney">

    <label for="prompt">Isi Prompt Lengkap</label>
    <textarea id="prompt" placeholder="Paste prompt panjangmu di sini..."></textarea>

    <button class="btn-save" onclick="savePrompt()" id="saveBtn">💾 Simpan Prompt Baru</button>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Cari judul atau kategori..." onkeyup="render()">
  </div>

  <div id="list" class="card-list"></div>
  <div id="toast">✅ Copied!</div>

  <script>
    // PASTE URL FIREBASE KAMU DI DALAM TANDA PETIK DI BAWAH INI:
    const FIREBASE_URL = "https://master-prompt-db-default-rtdb.firebaseio.com"; 

    let prompts = JSON.parse(localStorage.getItem('my_ai_prompts') || '[]');
    let editingId = null;

    window.addEventListener('DOMContentLoaded', initSync);

    async function initSync() {
      const statusEl = document.getElementById('syncStatus');
      
      if (!FIREBASE_URL || FIREBASE_URL.includes("GANTI_DENGAN")) {
        statusEl.innerText = "⚠️ Cloud belum dikonfigurasi. Menggunakan memori HP.";
        statusEl.style.color = "#d97706";
        statusEl.style.background = "#fef3c7";
        render();
        return;
      }

      try {
        statusEl.innerText = "🔄 Menyinkronkan data dengan Cloud...";
        const res = await fetch(`${FIREBASE_URL}/prompts.json`);
        let cloudData = await res.json();
        
        if (!cloudData) cloudData = [];

        // AMBIL DATA PROMPT LAMA DI HP DAN GABUNGKAN DENGAN CLOUD (AGAR TIDAK HILANG)
        const localData = JSON.parse(localStorage.getItem('my_ai_prompts') || '[]');
        
        const mergedMap = new Map();
        cloudData.forEach(item => mergedMap.set(item.id, item));
        localData.forEach(item => mergedMap.set(item.id, item));
        
        prompts = Array.from(mergedMap.values()).sort((a, b) => b.id - a.id);

        // Upload data gabungan ke cloud & simpan di HP
        await syncToCloud(prompts);
        
        statusEl.innerText = "☁️ Terhubung & Tersinkron Online!";
        statusEl.style.color = "#16a34a";
        statusEl.style.background = "#dcfce7";
      } catch (err) {
        console.error(err);
        statusEl.innerText = "⚠️ Mode Offline (Menggunakan Data HP)";
        statusEl.style.color = "#dc2626";
        statusEl.style.background = "#fee2e2";
      }
      render();
    }

    async function syncToCloud(data) {
      localStorage.setItem('my_ai_prompts', JSON.stringify(data));
      if (FIREBASE_URL && !FIREBASE_URL.includes("GANTI_DENGAN")) {
        try {
          await fetch(`${FIREBASE_URL}/prompts.json`, {
            method: 'PUT',
            body: JSON.stringify(data),
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (e) {
          console.error("Gagal simpan ke Firebase", e);
        }
      }
    }

    async function savePrompt() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value.trim() || 'General';
      const prompt = document.getElementById('prompt').value.trim();

      if (!title || !prompt) {
        showToast('⚠️ Judul & Prompt wajib diisi!');
        return;
      }

      if (editingId !== null) {
        prompts = prompts.map(p => p.id === editingId ? { ...p, title, category, prompt } : p);
        editingId = null;
        document.getElementById('saveBtn').innerText = '💾 Simpan Prompt Baru';
        showToast('✏️ Prompt diperbarui!');
      } else {
        prompts.unshift({ id: Date.now(), title, category, prompt });
        showToast('💾 Prompt disimpan!');
      }

      resetForm();
      render();
      await syncToCloud(prompts);
    }

    function resetForm() {
      document.getElementById('title').value = '';
      document.getElementById('category').value = '';
      document.getElementById('prompt').value = '';
    }

    function copyText(id) {
      const target = prompts.find(p => p.id === id);
      if (target) {
        navigator.clipboard.writeText(target.prompt).then(() => {
          showToast('📋 Tersalin ke Clipboard!');
        }).catch(() => {
          const t = document.createElement('textarea');
          t.value = target.prompt;
          document.body.appendChild(t);
          t.select();
          document.execCommand('copy');
          document.body.removeChild(t);
          showToast('📋 Prompt Tersalin!');
        });
      }
    }

    function editPrompt(id) {
      const target = prompts.find(p => p.id === id);
      if (target) {
        document.getElementById('title').value = target.title;
        document.getElementById('category').value = target.category;
        document.getElementById('prompt').value = target.prompt;
        editingId = id;
        document.getElementById('saveBtn').innerText = '🔄 Perbarui Prompt';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function deletePrompt(id) {
      if (confirm('Hapus prompt ini?')) {
        prompts = prompts.filter(p => p.id !== id);
        showToast('🗑️ Prompt dihapus');
        render();
        await syncToCloud(prompts);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('list');
      list.innerHTML = '';

      const filtered = prompts.filter(p => 
        p.title.toLowerCase().includes(q) || 
        p.category.toLowerCase().includes(q) ||
        p.prompt.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">Belum ada prompt tersimpan.</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${escapeHtml(p.title)}</div>
          <span class="card-tag">🏷️ ${escapeHtml(p.category)}</span>
          <div class="card-preview">${escapeHtml(p.prompt)}</div>
          <div class="card-actions">
            <button class="btn-copy" onclick="copyText(${p.id})">📋 Salin</button>
            <button class="btn-edit" onclick="editPrompt(${p.id})">✏️ Edit</button>
            <button class="btn-delete" onclick="deletePrompt(${p.id})">🗑️</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    render();
  </script>
</body>
</html>
